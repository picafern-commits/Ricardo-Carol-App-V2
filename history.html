<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131a"><title>Histórico - Ricardo&Carol</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"></head><body><div class="container"><header class="topbar"><div class="brand"><small>Ricardo&Carol</small><h1>Histórico</h1><p class="subtle">Tudo o que já foi marcado como comprado.</p></div><div style="display:flex;gap:10px;align-items:center"><span id="userBadge" class="user-chip">👤</span><button id="themeToggle" class="icon-btn" aria-label="Alternar tema">🌙</button></div></header><main class="content"><section class="panel"><div class="panel-head"><div><h2>Comprados</h2><p class="helper">O histórico é gerado automaticamente a partir da lista.</p></div><button id="clearHistoryView" class="btn ghost">Atualizar vista</button></div><div id="historyEmpty" class="empty-state hidden"><div class="icon">📜</div><h3>Sem histórico</h3><p>Os itens aparecem aqui depois de serem marcados como comprados.</p></div><div id="historyContainer" class="section-stack"></div></section><section class="panel"><div class="panel-head"><div><h2>Conta</h2><p class="helper">Podes terminar a sessão aqui.</p></div></div><button id="logoutBtn" class="btn danger">Terminar sessão</button></section></main><nav class="bottom-nav"><a class="nav-link" data-page="home" href="index.html">Início</a><a class="nav-link" data-page="add" href="add.html">Adicionar</a><a class="nav-link" data-page="list" href="list.html">Lista</a><a class="nav-link" data-page="history" href="history.html">Histórico</a></nav></div><script src="shared.js"></script><script>
attachGlobalUI('history');
function renderHistory() {
  const history = getHistory().sort((a,b) => new Date(b.doneAt) - new Date(a.doneAt));
  const holder = document.getElementById('historyContainer');
  holder.innerHTML = '';
  document.getElementById('historyEmpty').classList.toggle('hidden', history.length !== 0);
  history.forEach(item => {
    const card = document.createElement('article');
    card.className = 'history-card';
    card.innerHTML = `<div class="item-title-row"><div class="item-title">${escapeHtml(item.name)}</div><span class="pill store">${escapeHtml(item.store)}</span></div><div class="history-meta"><span>Qtd: ${item.qty}</span><span>${escapeHtml(item.category)}</span><span>${escapeHtml(item.priority)}</span></div>${item.notes ? `<div class="item-notes">${escapeHtml(item.notes)}</div>` : ''}<div class="history-total">Comprado em: ${formatDate(item.doneAt)}</div>`;
    holder.appendChild(card);
  });
}
document.getElementById('clearHistoryView').addEventListener('click', renderHistory);
renderHistory();
</script></body></html>
