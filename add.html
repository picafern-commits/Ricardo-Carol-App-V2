<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="theme-color" content="#10131a"><title>Adicionar - Ricardo&Carol</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="container"><header class="topbar"><div class="brand"><small>Ricardo&Carol</small><h1>Adicionar produto</h1><p class="subtle">Página dedicada para criar itens sem confusão.</p></div><div style="display:flex;gap:10px;align-items:center"><span id="userBadge" class="user-chip">👤</span><button id="themeToggle" class="icon-btn" aria-label="Alternar tema">🌙</button></div></header><main class="content"><section class="panel"><div class="panel-head"><div><h2>Novo item</h2><p class="helper">Preenche os campos e adiciona à lista partilhada.</p></div><span class="badge">Página separada</span></div><div class="form-grid"><div class="field"><label for="itemInput">Produto</label><input id="itemInput" type="text" placeholder="Ex: Leite"></div><div class="field field-small"><label for="qtyInput">Qtd</label><input id="qtyInput" type="number" min="1" value="1"></div><div class="field"><label for="categoryInput">Categoria</label><select id="categoryInput"><option>Supermercado</option><option>Padaria</option><option>Farmácia</option><option>Casa</option><option>Bebidas</option><option>Outros</option></select></div><div class="field"><label for="storeInput">Loja</label><select id="storeInput"><option>Continente</option><option>Pingo Doce</option><option>Lidl</option><option>Mercadona</option><option>Auchan</option><option>Outra</option></select></div><div class="field"><label for="priorityInput">Prioridade</label><select id="priorityInput"><option value="Alta">Alta</option><option value="Normal" selected>Normal</option><option value="Baixa">Baixa</option></select></div><div class="field field-full"><label for="notesInput">Notas</label><input id="notesInput" type="text" placeholder="Marca preferida, promoção, sem lactose..."></div></div><div class="actions-row"><button id="saveBtn" class="btn primary">Adicionar à lista</button><a href="list.html" class="btn soft">Ir para a lista</a></div></section><section class="panel"><div class="panel-head"><div><h2>Atalhos</h2><p class="helper">Exemplos rápidos para preencher mais depressa.</p></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost quickFill" data-name="Leite" data-category="Supermercado" data-store="Continente">Leite</button><button class="btn ghost quickFill" data-name="Pão" data-category="Padaria" data-store="Pingo Doce">Pão</button><button class="btn ghost quickFill" data-name="Detergente" data-category="Casa" data-store="Lidl">Detergente</button></div></section></main><nav class="bottom-nav"><a class="nav-link" data-page="home" href="index.html">Início</a><a class="nav-link" data-page="add" href="add.html">Adicionar</a><a class="nav-link" data-page="list" href="list.html">Lista</a><a class="nav-link" data-page="history" href="history.html">Histórico</a></nav></div><script src="shared.js"></script><script>
attachGlobalUI('add');
const itemInput = document.getElementById('itemInput');
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = itemInput.value.trim(); if(!name) return itemInput.focus();
  addItem({name, qty: Math.max(1, Number(document.getElementById('qtyInput').value || 1)), category: document.getElementById('categoryInput').value, store: document.getElementById('storeInput').value, priority: document.getElementById('priorityInput').value, notes: document.getElementById('notesInput').value.trim()});
  window.location.href = 'list.html';
});
itemInput.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('saveBtn').click(); });
document.querySelectorAll('.quickFill').forEach(btn => btn.addEventListener('click', () => {
  itemInput.value = btn.dataset.name; document.getElementById('categoryInput').value = btn.dataset.category; document.getElementById('storeInput').value = btn.dataset.store; itemInput.focus();
}));
</script></body></html>
