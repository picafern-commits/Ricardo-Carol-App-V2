<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Entrar - Ricardo & Carol</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body class="login-body">
  <div class="login-wrap">
    <section class="login-brand">
      <div>
        <div class="logo-badge">APP RICARDO & CAROL</div>
        <h1 class="login-title">Só Nós ❤️</h1>
        <p class="login-sub">A vossa lista privada.</p>
        </div>
    </section>

    <section class="login-panel">
      <div class="panel-top">
        <div>
          <div class="logo-badge">LOGIN</div>
        </div>
        
      </div>

      <div class="login-card">
        <h2>Login</h2>
        <p>Seleciona o utilizador para entrar na app.</p>

        <div class="user-grid">
          <button class="user-btn" onclick="login('Ricardo')">
            <div class="avatar">R</div>
            <div><strong>Ricardo</strong><span>Perfil principal</span></div>
          </button>
          <button class="user-btn" onclick="login('Carol')">
            <div class="avatar">C</div>
            <div><strong>Carol</strong><span>Perfil principal</span></div>
          </button>
          </div>

        
      </div>
    </section>
  </div>

  <script src="shared.js"></script>
  <script>
    applyTheme();
    function login(name){
      sessionStorage.setItem('user', name);
      window.location.href = 'index.html';
    }
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js'); }
  </script>
</body>
</html>
