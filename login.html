<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Entrar - Só Nós</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Só Nós">
  <meta name="theme-color" content="#070b14">
  <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body class="login-premium-body">
  <div class="login-premium-bg"></div>
  <div class="login-premium-overlay"></div>

  <main class="login-premium-shell">
    <section class="login-premium-card">
      <div class="login-premium-top">
        <div class="premium-badge">SÓ NÓS</div>
      </div>

      <div class="login-premium-content">
        <div class="login-premium-copy">
          <h1>Entrar</h1>
          <p>A vossa app privada, com um visual mais premium, inspirado no estilo iOS e App Braga.</p>
        </div>

        <div class="login-premium-users">
          <button class="premium-user-btn ricardo" onclick="login('Ricardo')">
            <span class="premium-avatar">R</span>
            <span class="premium-user-text">
              <strong>Ricardo</strong>
              <small>Entrar no perfil</small>
            </span>
          </button>

          <button class="premium-user-btn carol" onclick="login('Carol')">
            <span class="premium-avatar">C</span>
            <span class="premium-user-text">
              <strong>Carol</strong>
              <small>Entrar no perfil</small>
            </span>
          </button>
        </div>

        <div class="login-premium-note">
          No iPhone, abre no Safari e adiciona ao ecrã principal para ficar com aspeto de app real.
        </div>
      </div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script>
    applyTheme();
    function login(name){
      sessionStorage.setItem('user', name);
      window.location.href = 'index.html';
    }
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js'); }
  </script>
</body>
</html>
